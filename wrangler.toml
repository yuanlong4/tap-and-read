# Cloudflare Worker settings for Tap & Read.
# Secrets (FAMILY_PASSWORD, ANTHROPIC_API_KEY, DEEPINFRA_API_KEY) are NOT kept here:
# add them in the Cloudflare dashboard (see README).
# "name" must match the Worker's name in your Cloudflare dashboard.
name = "tap-and-read"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Give the site its free address: https://tap-and-read.<your-subdomain>.workers.dev
workers_dev = true

# Keep variables added in the Cloudflare dashboard when the site is redeployed
keep_vars = true

# The website files. /api/* goes to the code in src/ first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Where books, page photos and voice clips are stored
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "tap-and-read"

[vars]
# Reading voice. With OPENAI_API_KEY set, OpenAI is used; otherwise DeepInfra (Kokoro).
# OpenAI voices to try at https://www.openai.fm : alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer, verse
OPENAI_VOICE = "coral"
# Kokoro voices for DeepInfra, blended
VOICE = "af_bella,af_nicole"
CLAUDE_MODEL = "claude-sonnet-5-5"

[observability]
enabled = true
